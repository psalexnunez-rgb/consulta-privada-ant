<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Consulta">
<meta name="theme-color" content="#f5f7fa" id="theme-color-meta">
<title>Consulta Privada</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231b3f6e'/><text y='.92em' font-size='72' x='10' fill='white'>ψ</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sb:#1b3f6e;--sb-hover:#15325a;--sb-pale:#eaf0f9;--sb-pale2:#d4e3f5;
  --bg:#f5f7fa;--surface:#ffffff;--surface2:#f0f3f8;
  --border:#e0e6ef;--border2:#c8d4e8;
  --text:#1a2035;--text2:#4a5578;--text3:#8c96b0;
  --green:#1a7a5a;--green-bg:#e6f5ef;
  --red:#b83232;--red-bg:#fdeaea;
  --blue:#1a5fa8;--blue-bg:#e8f0fb;
  --orange:#b86000;--orange-bg:#fff3e0;
  --r:10px;--r-sm:7px;
  --sh:0 1px 3px rgba(27,63,110,.08);--sh-md:0 4px 16px rgba(27,63,110,.12);
  --font:'Inter',-apple-system,sans-serif;--mono:'SF Mono','Fira Mono',monospace;
  --sw:230px;
}
[data-theme="green"]{--sb:#1a5c3a;--sb-hover:#134d2f;--sb-pale:#e6f5ef;--sb-pale2:#c3e8d5;}
[data-theme="dark"]{
  --sb:#0f0f23;--sb-hover:#1a1a2e;--sb-pale:#1e1e32;--sb-pale2:#2a2a42;
  --bg:#0a0a14;--surface:#111120;--surface2:#1a1a2e;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --text:#f0f0f5;--text2:#8888a0;--text3:#55556a;
  --sh:0 1px 3px rgba(0,0,0,.3);--sh-md:0 4px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
.app{display:flex;height:100vh;height:100dvh}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--sb);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-box{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.2);text-align:center}
.login-psi{font-size:52px;font-family:serif;color:var(--sb);margin-bottom:6px;font-weight:700;line-height:1}
.login-title{font-size:18px;font-weight:600;color:#1a2035;margin-bottom:4px}
.login-sub{font-size:13px;color:#8c96b0;margin-bottom:24px}
.login-label{display:block;font-size:12px;color:#4a5578;font-weight:500;margin-bottom:5px;text-align:left}
.login-input{width:100%;padding:11px 14px;background:#f5f7fa;border:1px solid #c8d4e8;border-radius:8px;color:#1a2035;font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s;margin-bottom:12px}
.login-input:focus{border-color:#1b3f6e;box-shadow:0 0 0 3px #eaf0f9}
.login-btn{width:100%;padding:12px;background:#1b3f6e;border:none;border-radius:8px;color:#fff;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:background .2s;margin-top:4px}
.login-btn:hover{background:#15325a}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-error{font-size:12px;color:#b83232;margin-top:10px;min-height:18px;background:#fdeaea;border-radius:6px;padding:6px 10px;display:none}
.login-error.show{display:block}
.login-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}

/* SIDEBAR */
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--sb);display:flex;flex-direction:column;overflow:hidden;transition:transform .28s cubic-bezier(.4,0,.2,1),background .25s;z-index:50}
.sb-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sb-icon{width:35px;height:35px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0;font-family:serif}
.sb-title{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
.sb-sub{font-size:11px;color:rgba(255,255,255,.4)}
.sync-pill{margin-left:auto;font-size:10px;font-weight:500;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.5);transition:all .3s;flex-shrink:0}
.sync-pill.ok{background:rgba(52,211,153,.2);color:#6ee7b7}
.sync-pill.saving{background:rgba(251,191,36,.2);color:#fcd34d}
.sync-pill.error{background:rgba(248,113,113,.2);color:#fca5a5}
.sb-section{padding:14px 10px 4px}
.sb-label{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.09em;padding:0 8px 7px}
.nb{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:none;background:none;color:rgba(255,255,255,.6);font-family:var(--font);font-size:13px;border-radius:var(--r-sm);cursor:pointer;text-align:left;transition:all .15s}
.nb:hover{background:rgba(255,255,255,.08);color:#fff}
.nb.active{background:rgba(255,255,255,.15);color:#fff;font-weight:500}
.nb.alta{opacity:.5;font-style:italic}
.search-wrap{padding:8px 10px 2px}
.search-input{width:100%;padding:8px 11px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-sm);color:#fff;font-family:var(--font);font-size:13px;outline:none;transition:border-color .2s}
.search-input::placeholder{color:rgba(255,255,255,.3)}
.search-input:focus{border-color:rgba(255,255,255,.35)}
.pat-scroll{flex:1;overflow-y:auto;padding:4px 10px 8px}
.pat-scroll::-webkit-scrollbar{width:3px}
.pat-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.filter-toggle{margin:4px 10px 0;display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.4);cursor:pointer;padding:4px 8px;border-radius:var(--r-sm);transition:all .15s;border:none;background:none;width:calc(100% - 20px)}
.filter-toggle:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7)}
.sb-footer{padding:10px;border-top:1px solid rgba(255,255,255,.08)}
.add-btn{width:100%;padding:9px;background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.25);border-radius:var(--r-sm);color:rgba(255,255,255,.8);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.add-btn:hover{background:rgba(255,255,255,.18);color:#fff}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.main-header{height:56px;min-height:56px;padding:0 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:var(--sh);transition:background .25s,border-color .25s}
.hamburger{display:none;width:34px;height:34px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;align-items:center;justify-content:center;font-size:15px;color:var(--text2);flex-shrink:0}
.h-title{font-size:15px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.main-body{flex:1;overflow-y:auto;padding:22px}
.main-body::-webkit-scrollbar{width:4px}
.main-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* BUTTONS */
.btn{padding:8px 14px;border-radius:var(--r-sm);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text2);transition:all .15s;white-space:nowrap;box-shadow:var(--sh)}
.btn:hover{background:var(--surface2);color:var(--text)}
.btn-primary{background:var(--sb);border-color:var(--sb);color:#fff;box-shadow:0 2px 8px rgba(27,63,110,.2)}
.btn-primary:hover{background:var(--sb-hover);border-color:var(--sb-hover)}
.btn-danger{color:var(--red);border-color:transparent;background:var(--red-bg);box-shadow:none}
.btn-danger:hover{background:#fad4d4}
.btn-warning{color:var(--orange);border-color:transparent;background:var(--orange-bg);box-shadow:none}
.btn-warning:hover{background:#ffe0b2}
.btn-success{color:var(--green);border-color:transparent;background:var(--green-bg);box-shadow:none}
.btn-success:hover{background:#c8eadb}
.btn-icon{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px;border-radius:var(--r-sm)}
.btn-sm{padding:5px 11px;font-size:12px}

/* METRICS */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);transition:background .25s,border-color .25s}
.metric.navy{background:var(--sb);border-color:var(--sb)}
.metric.navy .m-label{color:rgba(255,255,255,.5)}
.metric.navy .m-value{color:#fff}
.metric.navy .m-sub{color:rgba(255,255,255,.35)}
.m-label{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.m-value{font-size:20px;font-weight:600;line-height:1.1;color:var(--text)}
.m-sub{font-size:11px;color:var(--text3);margin-top:4px}

/* ALERTS */
.alert-section{margin-bottom:18px}
.alert-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.alert-list{display:flex;flex-direction:column;gap:6px}
.alert-card{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-sm);cursor:pointer;transition:opacity .15s;border:1px solid}
.alert-card:hover{opacity:.85}
.alert-card.danger{background:var(--red-bg);border-color:#f5c0c0}
.alert-card.warning{background:var(--orange-bg);border-color:#f5d9b0}
.alert-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0}
.alert-card.danger .alert-badge{background:var(--red);color:#fff}
.alert-card.warning .alert-badge{background:var(--orange);color:#fff}
.alert-name{font-size:13px;font-weight:500;flex:1}
.alert-detail{font-size:11px;color:var(--text3)}

/* TABLE */
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);box-shadow:var(--sh);transition:background .25s,border-color .25s}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;transition:background .25s}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text);background:var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;transition:background .25s}
tr:last-child td{border-bottom:none}
tbody tr{background:var(--surface);transition:background .1s}
tbody tr:hover{background:var(--sb-pale)}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.b-cobrado{background:var(--green-bg);color:var(--green)}
.b-pagado{background:var(--blue-bg);color:var(--blue)}
.b-pendiente{background:var(--red-bg);color:var(--red)}
.b-empty{background:var(--surface2);color:var(--text3)}
.b-alta{background:var(--orange-bg);color:var(--orange)}

/* CHART */
.chart{display:flex;align-items:flex-end;gap:6px;height:100px;padding-bottom:4px}
.bc2{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bbar{width:100%;border-radius:4px 4px 0 0;background:var(--sb-pale2);min-height:3px;transition:height .4s ease,background .25s}
.bbar:hover{background:var(--sb)}
.bbar2{width:100%;border-radius:4px 4px 0 0;background:var(--green-bg);min-height:3px;opacity:.7}
.blbl{font-size:9px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.bval{font-size:8px;color:var(--text3);white-space:nowrap}
.stitle{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}

/* SEARCH OVERLAY */
.search-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;z-index:300;padding:60px 20px 20px;animation:fi .15s ease}
.search-box{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:var(--sh-md);overflow:hidden}
.search-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.search-input-wrap input{flex:1;border:none;background:none;font-family:var(--font);font-size:15px;color:var(--text);outline:none}
.search-input-wrap input::placeholder{color:var(--text3)}
.search-results{max-height:400px;overflow-y:auto}
.search-group{padding:8px 0}
.search-group-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;padding:4px 16px 6px}
.search-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;transition:background .1s}
.search-item:hover{background:var(--sb-pale)}
.search-item-name{font-size:13px;font-weight:500;flex:1}
.search-item-detail{font-size:11px;color:var(--text3)}
.search-empty{padding:24px;text-align:center;color:var(--text3);font-size:13px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;animation:fi .15s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-md);animation:su .2s cubic-bezier(.4,0,.2,1)}
@keyframes su{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:20px;color:var(--text)}
.fg{margin-bottom:14px}
.fl{display:block;font-size:12px;color:var(--text2);font-weight:500;margin-bottom:5px}
.fi2,.fs{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.fi2:focus,.fs:focus{border-color:var(--sb);box-shadow:0 0 0 3px var(--sb-pale)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}

/* OBS POPUP */
.obs-popup{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;animation:fi .15s ease}
.obs-box{background:var(--surface);border-radius:14px;padding:22px;width:100%;max-width:340px;box-shadow:var(--sh-md)}
.obs-box h4{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text)}
.obs-box p{font-size:13px;color:var(--text2);line-height:1.6;white-space:pre-wrap}
.obs-close{margin-top:16px;width:100%;padding:9px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;color:var(--text2)}
.obs-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:2px 4px;border-radius:4px;transition:background .15s;line-height:1}
.obs-btn:hover{background:var(--surface2)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 16px;font-size:13px;font-weight:500;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--font);transition:all .15s;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--sb)}

/* MONTH SUMMARY */
.msummary{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.mrow{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid var(--border)}
.mrow:last-of-type{border-bottom:none}
.mtotal{display:flex;justify-content:space-between;padding:8px 0 0;font-size:13px;font-weight:600;color:var(--text)}

/* SETTINGS */
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:20px;transition:background .25s,border-color .25s}
.settings-card h4{font-size:13px;font-weight:600;margin-bottom:16px;color:var(--text)}
.tarifa-row{display:grid;grid-template-columns:1fr 80px 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.tarifa-row:last-child{border-bottom:none}
.tarifa-name{font-size:13px;color:var(--text2);font-weight:500}
.tarifa-year{font-size:11px;color:var(--text3);text-align:center}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.theme-card{border:2px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;transition:all .2s;text-align:center}
.theme-card:hover{border-color:var(--border2)}
.theme-card.active{border-color:var(--sb)}
.theme-preview{height:48px;border-radius:6px;margin-bottom:8px;display:flex;overflow:hidden}
.theme-preview .tp-sb{width:35%;border-radius:6px 0 0 6px}
.theme-preview .tp-main{flex:1;border-radius:0 6px 6px 0}
.theme-name{font-size:12px;font-weight:500;color:var(--text2)}
.kbd{display:inline-block;padding:2px 6px;background:var(--surface2);border:1px solid var(--border2);border-radius:4px;font-size:11px;font-family:var(--mono);color:var(--text2)}

/* PIE CHART */
.pie-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.pie-legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px}
.pie-leg-item{display:flex;align-items:center;gap:8px;font-size:12px}
.pie-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* PRIVATE MODE */
.private-val{filter:blur(6px);user-select:none;pointer-events:none}

/* EMPTY / LOADING */
.empty{text-align:center;padding:48px 20px;color:var(--text3);font-size:13px}
.ei{font-size:36px;margin-bottom:10px;opacity:.4}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:220px;gap:12px;color:var(--text3);font-size:13px}
.spinner{width:26px;height:26px;border:2px solid var(--border2);border-top-color:var(--sb);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sb-overlay-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:49}

/* NEXT SESSION BADGE */
.next-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:var(--sb-pale);color:var(--sb);font-weight:500;margin-left:6px}

/* PORTRAIT mobile */
@media(max-width:768px){
  :root{--sw:255px}
  .sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:6px 0 32px rgba(0,0,0,.3)}
  .sb-overlay-bg.visible{display:block}
  .hamburger{display:flex}
  .main-body{padding:12px}
  .metric-grid{grid-template-columns:1fr 1fr;gap:8px}
  .metric{padding:12px 14px}
  .metric.navy{padding:14px 18px}
  .metric.navy .m-value{font-size:17px;word-break:break-all}
  .m-value{font-size:18px}
  .fr{grid-template-columns:1fr}
  .pdg{grid-template-columns:1fr!important}
  .tarifa-row{grid-template-columns:1fr 110px}
  .tarifa-year{display:none}
  .h-actions .btn-danger{display:none}
  .col-obs{display:none}
  td,th{padding:8px 8px}
  .h-title{font-size:14px}
}
@media(max-width:400px){.m-value{font-size:16px};.metric{padding:10px 11px}}

/* iPad portrait 2x2 metrics */

    pats.forEach(p=>{pts[p.id]={id:p.id,nombre:p.nombre,prevision:p.prevision,alta:p.alta||false,modalidad:p.modalidad||'Presencial',nextSession:p.next_session||null,inactiveWeeks:p.inactive_weeks||null,ses:[]};});
    sess.forEach(s=>{if(pts[s.paciente_id])pts[s.paciente_id].ses.push(s);});

function doSearch(){
  const q=document.getElementById('global-search')?.value?.toLowerCase()||'';

  if(!q){res.innerHTML='<div class="search-empty">Escribe para buscar…</div>';return;}

    html+='</div>';
  }
  if(!patMatches.length&&!sesMatches.length)html='<div class="search-empty">Sin resultados para "'+q+'"</div>';

// ── HELPERS ───────────────────────────────────────────
function getLastSession(p){
  if(!p.ses.length)return null;
  return p.ses.reduce((a,b)=>{
    const da=a.fecha?a.fecha.split('/').reverse().join(''):'';
    const db=b.fecha?b.fecha.split('/').reverse().join(''):'';
    return da>db?a:b;
  });
}
function weeksAgo(fechaStr){
  if(!fechaStr)return 999;
  const parts=fechaStr.split('/');
  if(parts.length<3)return 999;
  const d=new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0]));
  return Math.floor((Date.now()-d.getTime())/(7*24*3600*1000));
}

// ── DASHBOARD ─────────────────────────────────────────
function renderDashboard(){
  document.getElementById('view-title').textContent='Dashboard';
  document.getElementById('header-actions').innerHTML=`
    <button class="btn btn-icon" id="private-btn" onclick="togglePrivate()" title="Modo privado (Cmd+P)">${privateMode?'🙈':'👁'}</button>
    <button class="btn btn-icon" onclick="openSearch()" title="Búsqueda global (Cmd+F)">🔍</button>`;

  const all=allSessions();
  const curYearSes=all.filter(s=>s.fecha&&s.fecha.split('/')[2]===String(CUR_YEAR));
  const total=curYearSes.reduce((a,s)=>a+s.monto,0);
  const cobrado=curYearSes.filter(s=>s.estado==='Cobrado').reduce((a,s)=>a+s.monto,0);
  const pagado=curYearSes.filter(s=>s.estado==='Pagado').reduce((a,s)=>a+s.monto,0);
  const pendiente=curYearSes.filter(s=>s.estado==='Pendiente').reduce((a,s)=>a+s.monto,0);

  // Liquido
  const monSet=new Set(curYearSes.map(s=>s.mes));
  const nMeses=monSet.size;
  const impD=Math.round(total*IMPUESTO);
  const costoD=costoConsulta*nMeses;
  const liquido=total-impD-costoD;

  // Promedio sesiones
  const pActivos=Object.values(pts).filter(p=>!p.alta);
  const avgSes=pActivos.length?Math.round((pActivos.reduce((a,p)=>a+p.ses.length,0)/pActivos.length)*10)/10:0;

  const nActivos=pActivos.length;
  const nAlta=Object.values(pts).filter(p=>p.alta).length;

  // Chart by month
  const monMap={};
  all.forEach(s=>{
    const yr=s.fecha?s.fecha.split('/')[2]:String(CUR_YEAR);
    const key=`${yr}-${String(MESES.indexOf(s.mes)+1).padStart(2,'0')}`;
    if(MESES.indexOf(s.mes)>=0)monMap[key]=(monMap[key]||0)+s.monto;
  });
  const sortedKeys=Object.keys(monMap).sort();
  const maxV=Math.max(...Object.values(monMap),1);
  const bars=sortedKeys.map(k=>{
    const[yr,m]=k.split('-');
    const label=MESES[parseInt(m)-1].slice(0,3)+' '+yr.slice(2);
    const h=Math.max(Math.round((monMap[k]/maxV)*88),3);
    return`<div class="bc2"><div class="bval">${privateMode?'':'$'+fmt(monMap[k])}</div><div class="bbar" style="height:${h}px"></div><div class="blbl">${label}</div></div>`;
  }).join('');

  // Pie chart data
  const prevT={};
  curYearSes.forEach(s=>{prevT[s.prevision]=(prevT[s.prevision]||0)+s.monto;});
  const prevEntries=Object.entries(prevT).sort((a,b)=>b[1]-a[1]);
  const totalPrev=prevEntries.reduce((a,[,v])=>a+v,0)||1;
  let cumul=0;
  const pieSlices=prevEntries.map(([p,v],i)=>{
    const pct=v/totalPrev;
    const startDeg=cumul*360;
    const endDeg=(cumul+pct)*360;
    cumul+=pct;
    const start=polarToCart(50,50,40,startDeg);
    const end=polarToCart(50,50,40,endDeg);
    const large=pct>.5?1:0;
    return`<path d="M50,50 L${start.x},${start.y} A40,40 0 ${large},1 ${end.x},${end.y} Z" fill="${PIE_COLORS[i%PIE_COLORS.length]}" opacity=".85"/>`;
  }).join('');
  const pieLegend=prevEntries.map(([p,v],i)=>`
    <div class="pie-leg-item">
      <div class="pie-dot" style="background:${PIE_COLORS[i%PIE_COLORS.length]}"></div>
      <span style="color:var(--text2)">${p}</span>
      <span style="margin-left:auto;color:var(--text3);font-family:var(--mono);font-size:11px">${Math.round(v/totalPrev*100)}%</span>
    </div>`).join('');

  // ALERTS
  // 1. Payment pending
  const pendingAlerts=Object.values(pts).filter(p=>p.ses.filter(s=>s.estado==='Pendiente').length>=2);
  // 2. Inactive
  const inactiveAlerts=Object.values(pts).filter(p=>{
    if(p.alta)return false;
    const last=getLastSession(p);
    const threshold=p.inactiveWeeks||inactiveWeeks;
    return weeksAgo(last?.fecha)>=threshold;
  });
  // 3. Next sessions this week
  const today=new Date();
  const weekEnd=new Date(today);weekEnd.setDate(today.getDate()+7);
  const nextSessions=Object.values(pts).filter(p=>{
    if(!p.nextSession)return false;
    const parts=p.nextSession.split('/');
    if(parts.length<3)return false;
    const d=new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0]));
    return d>=today&&d<=weekEnd;
  }).sort((a,b)=>{
    const da=a.nextSession.split('/').reverse().join('');
    const db=b.nextSession.split('/').reverse().join('');
    return da.localeCompare(db);
  });

  let alertsHtml='';
  if(pendingAlerts.length||inactiveAlerts.length||nextSessions.length){
    alertsHtml='<div class="alert-section"><div class="alert-title">Alertas</div><div class="alert-list">';
    pendingAlerts.forEach(p=>{
      const n=p.ses.filter(s=>s.estado==='Pendiente').length;
      const monto=p.ses.filter(s=>s.estado==='Pendiente').reduce((a,s)=>a+s.monto,0);
      alertsHtml+=`<div class="alert-card danger" onclick="showPatient('${esc(p.id)}')">
        <span class="alert-badge">${n} pendientes</span>
        <span class="alert-name">${p.nombre}</span>
        <span class="alert-detail">${pv('$'+fmt(monto))}</span>
      </div>`;
    });
    inactiveAlerts.forEach(p=>{
      const last=getLastSession(p);
      const w=weeksAgo(last?.fecha);
      alertsHtml+=`<div class="alert-card warning" onclick="showPatient('${esc(p.id)}')">
        <span class="alert-badge">${w===999?'Sin sesiones':w+' sem.'}</span>
        <span class="alert-name">${p.nombre}</span>
        <span class="alert-detail">Sin actividad</span>
      </div>`;
    });
    if(nextSessions.length){
      alertsHtml+=`<div class="alert-card" style="background:var(--sb-pale);border-color:var(--sb-pale2);cursor:default">
        <span class="alert-badge" style="background:var(--sb);color:#fff">Esta semana</span>
        <span class="alert-name">${nextSessions.map(p=>`${p.nombre} (${p.nextSession})`).join(', ')}</span>
      </div>`;
    }
    alertsHtml+='</div></div>';
  }

  document.getElementById('main-body').innerHTML=`
    ${alertsHtml}
    <div class="metric-grid">
      <div class="metric navy" style="padding:18px 20px"><div class="m-label">Total facturado ${CUR_YEAR}</div><div class="m-value">${pv('$'+fmt(total))}</div><div class="m-sub">${curYearSes.length} ses. · ${nActivos} activos${nAlta?` · ${nAlta} alta`:''}</div></div>
      <div class="metric"><div class="m-label">Cobrado</div><div class="m-value" style="color:var(--green)">${pv('$'+fmt(cobrado))}</div><div class="m-sub">${curYearSes.filter(s=>s.estado==='Cobrado').length} sesiones</div></div>
      <div class="metric"><div class="m-label">Pagado</div><div class="m-value" style="color:var(--blue)">${pv('$'+fmt(pagado))}</div><div class="m-sub">${curYearSes.filter(s=>s.estado==='Pagado').length} sesiones</div></div>
      <div class="metric"><div class="m-label">Pendiente</div><div class="m-value" style="color:var(--red)">${pv('$'+fmt(pendiente))}</div><div class="m-sub">${curYearSes.filter(s=>s.estado==='Pendiente').length} sesiones</div></div>
      <div class="metric" style="border-left:3px solid var(--sb)"><div class="m-label">Líquido a percibir</div><div class="m-value" style="color:var(--sb)">${pv('$'+fmt(liquido))}</div><div class="m-sub">-imp. -consulta</div></div>
      <div class="metric"><div class="m-label">Promedio ses./paciente</div><div class="m-value">${avgSes}</div><div class="m-sub">${nActivos} pacientes activos</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 200px;gap:16px;margin-bottom:24px;align-items:start">
      <div><div class="stitle">Ingresos por mes</div><div class="chart">${bars||'<span style="color:var(--text3);font-size:12px">Sin datos aún</span>'}</div></div>
      <div><div class="stitle">Por previsión</div>
        <div class="pie-wrap">
          <svg viewBox="0 0 100 100" width="90" height="90" style="flex-shrink:0">${pieSlices}<circle cx="50" cy="50" r="22" fill="var(--surface)"/></svg>
          <div class="pie-legend">${pieLegend}</div>
        </div>
      </div>
    </div>`;
}

function polarToCart(cx,cy,r,deg){
  const rad=(deg-90)*Math.PI/180;
  return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};
}

function buildMesTab(all,yr){
  const monMap={};
  all.filter(s=>s.fecha&&s.fecha.split('/')[2]===yr).forEach(s=>{
    const mesIdx=MESES.indexOf(s.mes);if(mesIdx<0)return;
    const key=String(mesIdx+1).padStart(2,'0');
    if(!monMap[key])monMap[key]={mes:s.mes,ses:[],total:0,cob:0,pag:0,pen:0};
    monMap[key].ses.push(s);monMap[key].total+=s.monto;
    if(s.estado==='Cobrado')monMap[key].cob+=s.monto;
    else if(s.estado==='Pagado')monMap[key].pag+=s.monto;
    else if(s.estado==='Pendiente')monMap[key].pen+=s.monto;
  });
  const rows=Object.keys(monMap).sort().map(k=>{
    const d=monMap[k];
    const imp=Math.round(d.total*IMPUESTO);
    const liq=d.total-imp-costoConsulta;
    return`<tr><td style="font-weight:500">${d.mes[0].toUpperCase()+d.mes.slice(1)} ${yr}</td><td style="color:var(--text3)">${d.ses.length}</td><td style="font-family:var(--mono)">${pv('$'+fmt(d.total))}</td><td style="color:var(--green);font-family:var(--mono)">${pv('$'+fmt(d.cob))}</td><td style="color:var(--blue);font-family:var(--mono)">${pv('$'+fmt(d.pag))}</td><td style="color:var(--red);font-family:var(--mono)">${pv('$'+fmt(d.pen))}</td><td style="color:var(--orange);font-family:var(--mono);font-size:12px">${pv('-$'+fmt(imp))}</td><td style="color:var(--text3);font-family:var(--mono);font-size:12px">${pv('-$'+fmt(costoConsulta))}</td><td style="font-family:var(--mono);font-weight:600;color:${liq>=0?'var(--sb)':'var(--red)'}">${pv('$'+fmt(liq))}</td></tr>`;
  }).join('');
  const yrSes=all.filter(s=>s.fecha&&s.fecha.split('/')[2]===yr);
  const total=yrSes.reduce((a,s)=>a+s.monto,0);
  const cob=yrSes.filter(s=>s.estado==='Cobrado').reduce((a,s)=>a+s.monto,0);
  const pag=yrSes.filter(s=>s.estado==='Pagado').reduce((a,s)=>a+s.monto,0);
  const pen=yrSes.filter(s=>s.estado==='Pendiente').reduce((a,s)=>a+s.monto,0);
  const nM=Object.keys(monMap).length;
  const totalImp=Math.round(total*IMPUESTO);
  const totalCosto=costoConsulta*nM;
  const totalLiq=total-totalImp-totalCosto;
  return`<div class="tw"><table><thead><tr><th>Mes</th><th>Ses.</th><th>Total</th><th style="color:var(--green)">Cobrado</th><th style="color:var(--blue)">Pagado</th><th style="color:var(--red)">Pendiente</th><th style="color:var(--orange)">Impuesto</th><th>Consulta</th><th style="color:var(--sb)">Líquido</th></tr></thead>
  <tbody>${rows}<tr style="background:var(--surface2);border-top:2px solid var(--border2)"><td style="font-weight:600">Total ${yr}</td><td style="color:var(--text3)">${yrSes.length}</td><td style="font-family:var(--mono);font-weight:600">${pv('$'+fmt(total))}</td><td style="color:var(--green);font-family:var(--mono);font-weight:600">${pv('$'+fmt(cob))}</td><td style="color:var(--blue);font-family:var(--mono);font-weight:600">${pv('$'+fmt(pag))}</td><td style="color:var(--red);font-family:var(--mono);font-weight:600">${pv('$'+fmt(pen))}</td><td style="color:var(--orange);font-family:var(--mono);font-weight:600">${pv('-$'+fmt(totalImp))}</td><td style="font-family:var(--mono);font-weight:600">${pv('-$'+fmt(totalCosto))}</td><td style="font-family:var(--mono);font-weight:700;color:${totalLiq>=0?'var(--sb)':'var(--red)'}">${pv('$'+fmt(totalLiq))}</td></tr></tbody></table></div>`;
}

function buildPatTab(all,yr){
  let list=Object.values(pts).map(p=>{
    const ses=p.ses.filter(s=>s.fecha&&s.fecha.split('/')[2]===yr);
    const t=ses.reduce((a,s)=>a+s.monto,0);
    const c=ses.filter(s=>s.estado==='Cobrado').reduce((a,s)=>a+s.monto,0);
    const pg=ses.filter(s=>s.estado==='Pagado').reduce((a,s)=>a+s.monto,0);
    const last=getLastSession(p);
    return{...p,yrSes:ses,t,c,pg,last};
  }).filter(p=>p.yrSes.length>0);

  // Sort
  list.sort((a,b)=>{
    let va,vb;
    if(resumenSortCol==='nombre'){va=a.nombre;vb=b.nombre;}
    else if(resumenSortCol==='ses'){va=a.yrSes.length;vb=b.yrSes.length;}
    else if(resumenSortCol==='total'){va=a.t;vb=b.t;}
    else{va=a.nombre;vb=b.nombre;}
    if(va<vb)return -resumenSortDir;
    if(va>vb)return resumenSortDir;
    return 0;
  });

  const rows=list.map(p=>{
    const altaBadge=p.alta?'<span class="badge b-alta" style="margin-left:6px">Alta</span>':'';
    const pend=p.yrSes.filter(s=>s.estado==='Pendiente').length;
    const pendBadge=pend>=2?`<span class="badge b-pendiente" style="margin-left:4px">${pend}⚠</span>`:'';
    const avgM=p.yrSes.length>0?(p.yrSes.length/Math.max(new Set(p.yrSes.map(s=>s.mes)).size,1)).toFixed(1):'—';
    return`<tr><td><a href="#" onclick="showPatient('${esc(p.id)}');return false;" style="color:var(--sb);font-weight:500">${p.nombre}</a>${altaBadge}${pendBadge}</td><td>${modalBadge(p.modalidad)}</td><td style="color:var(--text3)">${p.prevision||'—'}</td><td style="color:var(--text3)">${p.yrSes.length}</td><td style="font-family:var(--mono)">${pv('$'+fmt(p.t))}</td><td style="color:var(--green);font-family:var(--mono)">${pv('$'+fmt(p.c))}</td><td style="color:var(--blue);font-family:var(--mono)">${pv('$'+fmt(p.pg))}</td></tr>`;
  }).join('');

  function sortIcon(col){return resumenSortCol===col?(resumenSortDir===1?'↑':'↓'):'↕';}
  function sortFn(col){return`onclick="resumenSortCol='${col}';resumenSortDir=resumenSortCol==='${col}'?resumenSortDir*-1:1;resumenSortCol='${col}';renderResumen();switchTabById('tp')"`;}

  return`<div class="tw"><table><thead><tr>
    <th class="sortable" ${sortFn('nombre')}>Paciente ${sortIcon('nombre')}</th>
    <th>Modalidad</th><th>Previsión</th>
    <th class="sortable" ${sortFn('ses')}>Ses. ${sortIcon('ses')}</th>
    <th class="sortable" ${sortFn('total')}>Total ${sortIcon('total')}</th>
    <th style="color:var(--green)">Cobrado</th>
    <th style="color:var(--blue)">Pagado</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function buildComparativa(all,yr,prevYr){
  const getMonthData=(year)=>{
    const map={};
    all.filter(s=>s.fecha&&s.fecha.split('/')[2]===year).forEach(s=>{
      const i=MESES.indexOf(s.mes);if(i<0)return;
      const k=String(i+1).padStart(2,'0');
      map[k]=(map[k]||0)+s.monto;
    });
    return map;
  };
  const curData=getMonthData(yr);
  const prevData=getMonthData(prevYr);
  const allKeys=[...new Set([...Object.keys(curData),...Object.keys(prevData)])].sort();
  const maxV=Math.max(...allKeys.map(k=>Math.max(curData[k]||0,prevData[k]||0)),1);

  const bars=allKeys.map(k=>{
    const c=curData[k]||0;const p=prevData[k]||0;
    const hc=Math.max(Math.round((c/maxV)*80),c>0?2:0);
    const hp=Math.max(Math.round((p/maxV)*80),p>0?2:0);
    const label=MESES[parseInt(k)-1].slice(0,3);
    return`<div class="bc2" style="gap:2px">
      <div class="bbar" style="height:${hc}px;background:var(--sb)"></div>
      <div class="bbar2" style="height:${hp}px"></div>
      <div class="blbl">${label}</div>
    </div>`;
  }).join('');

  const rows=allKeys.map(k=>{
    const c=curData[k]||0;const p=prevData[k]||0;
    const diff=c-p;const pct=p>0?Math.round((diff/p)*100):null;
    const col=diff>=0?'var(--green)':'var(--red)';
    const arrow=diff>=0?'↑':'↓';
    return`<tr><td style="font-weight:500">${MESES[parseInt(k)-1][0].toUpperCase()+MESES[parseInt(k)-1].slice(1)}</td>
      <td style="font-family:var(--mono)">${pv('$'+fmt(c))}</td>
      <td style="font-family:var(--mono);color:var(--text3)">${p>0?pv('$'+fmt(p)):'—'}</td>
      <td style="font-family:var(--mono);color:${col};font-weight:600">${diff!==0?arrow+' '+pv('$'+fmt(Math.abs(diff))):'—'}</td>
      <td style="color:${col};font-weight:600">${pct!==null?pct+'%':'—'}</td>
    </tr>`;
  }).join('');

  const totCur=Object.values(curData).reduce((a,v)=>a+v,0);
  const totPrev=Object.values(prevData).reduce((a,v)=>a+v,0);
  const totDiff=totCur-totPrev;
  const totPct=totPrev>0?Math.round((totDiff/totPrev)*100):null;
  const totCol=totDiff>=0?'var(--green)':'var(--red)';

  return`<div style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px"><div style="width:12px;height:12px;background:var(--sb);border-radius:2px"></div>${yr}</div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px"><div style="width:12px;height:12px;background:var(--green-bg);border:1px solid var(--green);border-radius:2px"></div>${prevYr}</div>
    </div>
    <div class="chart" style="height:90px">${bars}</div>
  </div>
  <div class="tw"><table><thead><tr><th>Mes</th><th>${yr}</th><th>${prevYr}</th><th>Diferencia</th><th>Variación</th></tr></thead>
  <tbody>${rows}<tr style="background:var(--surface2);font-weight:600;border-top:2px solid var(--border2)">
    <td>Total</td><td style="font-family:var(--mono)">${pv('$'+fmt(totCur))}</td><td style="font-family:var(--mono);color:var(--text3)">${pv('$'+fmt(totPrev))}</td>
    <td style="font-family:var(--mono);color:${totCol}">${totDiff!==0?(totDiff>0?'↑':'↓')+' '+pv('$'+fmt(Math.abs(totDiff))):'—'}</td>
    <td style="color:${totCol}">${totPct!==null?totPct+'%':'—'}</td>
  </tr></tbody></table></div>`;
}

function buildPrevTab(all,yr,prevYr){
  const getData=(year)=>{
    const map={};
    all.filter(s=>s.fecha&&s.fecha.split('/')[2]===year).forEach(s=>{
      map[s.prevision]=(map[s.prevision]||0)+s.monto;
    });
    return map;
  };
  const curData=getData(yr);const prevData=getData(prevYr);
  const prevs=[...new Set([...Object.keys(curData),...Object.keys(prevData)])];
  const rows=prevs.map(p=>{
    const c=curData[p]||0;const prev=prevData[p]||0;
    const diff=c-prev;const pct=prev>0?Math.round((diff/prev)*100):null;
    const col=diff>=0?'var(--green)':'var(--red)';
    return`<tr><td style="font-weight:500">${p}</td><td style="font-family:var(--mono)">${pv('$'+fmt(c))}</td><td style="font-family:var(--mono);color:var(--text3)">${prev>0?pv('$'+fmt(prev)):'—'}</td><td style="color:${col};font-weight:600">${pct!==null?pct+'%':'—'}</td></tr>`;
  }).join('');
  return`<div class="tw"><table><thead><tr><th>Previsión</th><th>${yr}</th><th>${prevYr}</th><th>Variación</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function switchTab(btn,id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  ['tm','tp','tc','tprev'].forEach(t=>{const el=document.getElementById(t);if(el)el.style.display='none';});
  document.getElementById(id).style.display='';
}
function switchTabById(id){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const ids=['tm','tp','tc','tprev'];
    t.classList.toggle('active',ids[i]===id);
  });
  ['tm','tp','tc','tprev'].forEach(t=>{const el=document.getElementById(t);if(el)el.style.display=t===id?'':'none';});
}

    ?`<button class="btn btn-success btn-sm" onclick="toggleAlta('${esc(id)}',false)">↩ Reactivar</button>`
    :`<button class="btn btn-warning btn-sm" onclick="toggleAlta('${esc(id)}',true)">✓ Dar de alta</button>`;
  document.getElementById('header-actions').innerHTML=`
    <button class="btn btn-icon" id="private-btn" onclick="togglePrivate()">${privateMode?'🙈':'👁'}</button>
    <button class="btn btn-icon" onclick="openSearch()">🔍</button>
    <button class="btn btn-primary btn-sm" onclick="showAddSes('${esc(id)}')">+ Sesión</button>
    ${altaBtn}
    <button class="btn btn-danger btn-sm" onclick="delPatient('${esc(id)}')">Eliminar</button>`;

  const total=p.ses.reduce((a,s)=>a+s.monto,0);
  const cob=p.ses.filter(s=>s.estado==='Cobrado').reduce((a,s)=>a+s.monto,0);
  const pag=p.ses.filter(s=>s.estado==='Pagado').reduce((a,s)=>a+s.monto,0);
  const pen=p.ses.filter(s=>s.estado==='Pendiente').length;

  const sorted=[...p.ses].sort((a,b)=>{
    let va,vb;
    if(sortCol==='fecha'){va=a.fecha?a.fecha.split('/').reverse().join(''):'';vb=b.fecha?b.fecha.split('/').reverse().join(''):'';}
    else if(sortCol==='mes'){va=MESES.indexOf(a.mes);vb=MESES.indexOf(b.mes);}
    else if(sortCol==='estado'){const o={Cobrado:1,Pagado:2,Pendiente:3,'':4};va=o[a.estado]||4;vb=o[b.estado]||4;}
    else{va=a.fecha?a.fecha.split('/').reverse().join(''):'';vb=b.fecha?b.fecha.split('/').reverse().join(''):'';}
    if(va<vb)return -sortDir;if(va>vb)return sortDir;return 0;
  });

  function si(col){return sortCol===col?(sortDir===1?'↑':'↓'):'↕';}

  const rows=sorted.map((s,i)=>{
    const hasObs=s.observaciones&&s.observaciones.trim();
    return`<tr>
      <td style="color:var(--text3)">${i+1}</td>
      <td style="font-family:var(--mono);font-size:12px">${s.fecha}</td>
      <td style="color:var(--text3)">${s.mes||'—'}</td>
      <td><span style="font-size:11px;background:var(--surface2);padding:2px 7px;border-radius:4px;color:var(--text2)">${s.prevision||'—'}</span></td>
      <td style="font-family:var(--mono)">${pv('$'+fmt(s.monto))}</td>
      <td>${badge(s.estado)}</td>
      <td class="col-obs" style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text3)">${s.observaciones||'—'}</td>
      <td style="white-space:nowrap;text-align:center">
        <button class="obs-btn" style="opacity:${hasObs?1:.25}" onclick="showObs('${esc(s.observaciones||'')}','${esc(s.fecha)}')">💬</button>
        <button class="btn btn-sm" style="margin-left:4px" onclick="showEditSes('${esc(id)}','${esc(s.id)}')">Editar</button>
        <button class="btn btn-danger btn-sm" style="margin-left:4px" onclick="delSes('${esc(id)}','${esc(s.id)}')">×</button>
      </td>
    </tr>`;
  }).join('');

  const mT={};
  p.ses.forEach(s=>{
    const yr=s.fecha?s.fecha.split('/')[2]:String(CUR_YEAR);
    const mesIdx=MESES.indexOf(s.mes);if(mesIdx<0)return;
    const key=`${yr}-${String(mesIdx+1).padStart(2,'0')}`;
    if(!mT[key])mT[key]={label:s.mes[0].toUpperCase()+s.mes.slice(1)+' '+yr,total:0};
    mT[key].total+=s.monto;
  });
  const mSum=Object.keys(mT).sort().map(k=>`<div class="mrow"><span style="color:var(--text3)">${mT[k].label}</span><span style="font-family:var(--mono)">${pv('$'+fmt(mT[k].total))}</span></div>`).join('');

  const altaNote=p.alta?`<div style="background:var(--orange-bg);border:1px solid var(--orange);border-radius:var(--r-sm);padding:10px 14px;font-size:12px;color:var(--orange);margin-bottom:16px">✓ Paciente dado de alta</div>`:'';
  const pendNote=pen>=2?`<div style="background:var(--red-bg);border:1px solid #f5c0c0;border-radius:var(--r-sm);padding:10px 14px;font-size:12px;color:var(--red);margin-bottom:16px">⚠ ${pen} sesiones con pago pendiente</div>`:'';

  const nextOpts=['1 semana','15 días','1 mes'];
  const nextHtml=p.nextSession
    ?`<div style="font-size:12px;color:var(--text2);margin-top:6px">Próxima: <strong>${p.nextSession}</strong> <button class="btn btn-sm" style="margin-left:6px;padding:2px 8px;font-size:11px" onclick="clearNextSession('${esc(id)}')">✕</button></div>`
    :`<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">${nextOpts.map(o=>`<button class="btn btn-sm" style="font-size:11px" onclick="setNextSession('${esc(id)}','${o}')">${o}</button>`).join('')}</div>`;

  const isOnline=p.modalidad==='En línea';
  const modColor=isOnline?'#1a7a5a':'#b86000';

  document.getElementById('main-body').innerHTML=`
    ${altaNote}${pendNote}
    <div class="metric-grid" style="margin-bottom:18px">
      <div class="metric navy" style="padding:18px 20px"><div class="m-label">Total</div><div class="m-value">${pv('$'+fmt(total))}</div><div class="m-sub">${p.ses.length} sesiones</div></div>
      <div class="metric"><div class="m-label">Cobrado</div><div class="m-value" style="color:var(--green)">${pv('$'+fmt(cob))}</div><div class="m-sub">${p.ses.filter(s=>s.estado==='Cobrado').length} sesiones</div></div>
      <div class="metric"><div class="m-label">Pagado</div><div class="m-value" style="color:var(--blue)">${pv('$'+fmt(pag))}</div><div class="m-sub">${p.ses.filter(s=>s.estado==='Pagado').length} sesiones</div></div>
      <div class="metric"><div class="m-label">Pendiente</div><div class="m-value" style="color:var(--red)">${pv('$'+fmt(p.ses.filter(s=>s.estado==='Pendiente').reduce((a,s)=>a+s.monto,0)))}</div><div class="m-sub">${pen} sesiones</div></div>
      <div class="metric"><div class="m-label">Modalidad</div><div class="m-value" style="font-size:14px;color:${modColor}"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${modColor};margin-right:6px;vertical-align:middle"></span>${p.modalidad||'Presencial'}</div><div class="m-sub" style="margin-top:8px"><button class="btn btn-sm" style="padding:3px 10px;font-size:11px" onclick="toggleModalidad('${esc(id)}')">Cambiar</button></div></div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:16px;box-shadow:var(--sh)">
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Próxima sesión</div>
      ${nextHtml}
      <div style="margin-top:10px;font-size:11px;color:var(--text3)">Umbral inactividad individual: <input type="number" style="width:50px;padding:2px 6px;border:1px solid var(--border2);border-radius:4px;font-size:11px;background:var(--bg);color:var(--text);margin:0 4px" value="${p.inactiveWeeks||''}" placeholder="${inactiveWeeks}" oninput="savePatientWeeks('${esc(id)}',this.value)"> semanas</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 170px;gap:16px;align-items:start" class="pdg">
      <div><div class="stitle">Sesiones</div>${p.ses.length?`<div class="tw"><table><thead><tr>
        <th>#</th>
        <th class="sortable" onclick="sortSessions('fecha')">Fecha ${si('fecha')}</th>
        <th class="sortable" onclick="sortSessions('mes')">Mes ${si('mes')}</th>
        <th>Previsión</th><th>Monto</th>
        <th class="sortable" onclick="sortSessions('estado')">Estado ${si('estado')}</th>
        <th class="col-obs">Observaciones</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty"><div class="ei">📋</div><p>Sin sesiones. Usa el botón + Sesión.</p></div>'}</div>
      <div><div class="stitle">Por mes</div><div class="msummary">${mSum||'<div style="font-size:12px;color:var(--text3)">Sin datos</div>'}<div class="mtotal"><span>Total</span><span style="font-family:var(--mono)">${pv('$'+fmt(total))}</span></div></div></div>
    </div>`;
}

async function setNextSession(id,opt){
  const today=new Date();
  let d=new Date(today);
  if(opt==='1 semana')d.setDate(today.getDate()+7);
  else if(opt==='15 días')d.setDate(today.getDate()+15);
  else if(opt==='1 mes')d.setMonth(today.getMonth()+1);
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const fecha=`${dd}/${mm}/${d.getFullYear()}`;
  sync('saving');
  const{error}=await sb.from('pacientes').update({next_session:fecha}).eq('id',id);
  if(error){sync('error');return;}
  pts[id].nextSession=fecha;sync('ok');renderPatient(id);
}
async function clearNextSession(id){
  sync('saving');
  const{error}=await sb.from('pacientes').update({next_session:null}).eq('id',id);
  if(error){sync('error');return;}
  pts[id].nextSession=null;sync('ok');renderPatient(id);
}
async function savePatientWeeks(id,val){
  const w=parseInt(val)||null;
  pts[id].inactiveWeeks=w;
  await sb.from('pacientes').update({inactive_weeks:w}).eq('id',id);
}
async function toggleAlta(id,alta){
  const p=pts[id];
  if(!confirm(`¿${alta?'Dar de alta':'Reactivar'} a ${p?.nombre}?`))return;
  sync('saving');
  const{error}=await sb.from('pacientes').update({alta}).eq('id',id);
  if(error){sync('error');return;}
  pts[id].alta=alta;sync('ok');renderNav();renderPatient(id);
}
async function toggleModalidad(id){
  const p=pts[id];
  const nueva=p.modalidad==='En línea'?'Presencial':'En línea';
  sync('saving');
  const{error}=await sb.from('pacientes').update({modalidad:nueva}).eq('id',id);
  if(error){sync('error');return;}
  pts[id].modalidad=nueva;sync('ok');renderPatient(id);
}

function showAddSes(id){sesForm(id);}
function showEditSes(id,sid){const s=pts[id]?.ses.find(x=>x.id===sid);if(s)sesForm(id,s);}

async function saveSesNew(id){
  const data={paciente_id:id,...getSesData()};sync('saving');
  const{data:saved,error}=await sb.from('sesiones').insert(data).select().single();
  if(error){sync('error');alert('Error al guardar');return;}
  pts[id].ses.push(saved);sync('ok');closeModal();renderPatient(id);

async function saveSesEdit(id,sid){
  const data=getSesData();sync('saving');
  const{error}=await sb.from('sesiones').update(data).eq('id',sid);
  if(error){sync('error');alert('Error al guardar');return;}
  const i=pts[id].ses.findIndex(s=>s.id===sid);

async function delSes(id,sid){

  const{error}=await sb.from('sesiones').delete().eq('id',sid);
  if(error){sync('error');return;}
  pts[id].ses=pts[id].ses.filter(s=>s.id!==sid);sync('ok');renderPatient(id);
}
async function delPatient(id){
  const p=pts[id];
  if(!confirm(`¿Eliminar a ${p?.nombre} y todas sus sesiones?\nNo se puede deshacer.`))return;sync('saving');
  const{error}=await sb.from('pacientes').delete().eq('id',id);

async function generatePdf(){
  const year=document.getElementById('pdf-year')?.value||String(CUR_YEAR);
  closeModal();sync('saving','Generando PDF…');
  const all=allSessions();
  const yearSessions=all.filter(s=>s.fecha&&s.fecha.split('/')[2]===year);
  const patientsWithSessions=Object.values(pts).filter(p=>p.ses.some(s=>s.fecha&&s.fecha.split('/')[2]===year)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const total=yearSessions.reduce((a,s)=>a+s.monto,0);
  const cobrado=yearSessions.filter(s=>s.estado==='Cobrado').reduce((a,s)=>a+s.monto,0);
  const pagado=yearSessions.filter(s=>s.estado==='Pagado').reduce((a,s)=>a+s.monto,0);
  const pendiente=yearSessions.filter(s=>s.estado==='Pendiente').reduce((a,s)=>a+s.monto,0);
  const monMap={};
  yearSessions.forEach(s=>{
    const mesIdx=MESES.indexOf(s.mes);if(mesIdx<0)return;
    const key=String(mesIdx+1).padStart(2,'0');
    if(!monMap[key])monMap[key]={mes:s.mes,ses:[],total:0,cob:0,pag:0,pen:0};
    monMap[key].ses.push(s);monMap[key].total+=s.monto;
    if(s.estado==='Cobrado')monMap[key].cob+=s.monto;
    else if(s.estado==='Pagado')monMap[key].pag+=s.monto;
    else if(s.estado==='Pendiente')monMap[key].pen+=s.monto;
  });
  const sortedMon=Object.keys(monMap).sort().map(k=>({...monMap[k]}));
  const maxV=Math.max(...sortedMon.map(m=>m.total),1);
  const barW=sortedMon.length>0?Math.floor(460/sortedMon.length)-4:40;
  const bars=sortedMon.map((m,i)=>{const h=Math.max(Math.round((m.total/maxV)*80),2);const x=i*(barW+4)+10;return`<rect x="${x}" y="${90-h}" width="${barW}" height="${h}" fill="#1b3f6e" rx="2"/><text x="${x+barW/2}" y="105" text-anchor="middle" font-size="8" fill="#666">${m.mes.slice(0,3)}</text><text x="${x+barW/2}" y="${84-h}" text-anchor="middle" font-size="7" fill="#1b3f6e">$${Math.round(m.total/1000)}k</text>`;}).join('');
  const mesRows=sortedMon.map(m=>`<tr><td>${m.mes[0].toUpperCase()+m.mes.slice(1)}</td><td style="text-align:center">${m.ses.length}</td><td style="text-align:right">$${fmt(m.total)}</td><td style="text-align:right;color:#1a7a5a">$${fmt(m.cob)}</td><td style="text-align:right;color:#1a5fa8">$${fmt(m.pag)}</td><td style="text-align:right;color:#b83232">$${fmt(m.pen)}</td></tr>`).join('');
  const prevT={};yearSessions.forEach(s=>{prevT[s.prevision]=(prevT[s.prevision]||{total:0,n:0});prevT[s.prevision].total+=s.monto;prevT[s.prevision].n++;});
  const prevRows=Object.entries(prevT).sort((a,b)=>b[1].total-a[1].total).map(([p,v])=>`<tr><td>${p}</td><td style="text-align:center">${v.n}</td><td style="text-align:right">$${fmt(v.total)}</td></tr>`).join('');
  const patientPages=patientsWithSessions.map(p=>{
    const pSes=p.ses.filter(s=>s.fecha&&s.fecha.split('/')[2]===year);
    const pTotal=pSes.reduce((a,s)=>a+s.monto,0);
    const pCob=pSes.filter(s=>s.estado==='Cobrado').reduce((a,s)=>a+s.monto,0);
    const pPag=pSes.filter(s=>s.estado==='Pagado').reduce((a,s)=>a+s.monto,0);
    const pPen=pSes.filter(s=>s.estado==='Pendiente').reduce((a,s)=>a+s.monto,0);
    const sesRows=pSes.map((s,i)=>`<tr style="background:${i%2===0?'#fff':'#f7f9fc'}"><td style="text-align:center">${i+1}</td><td>${s.fecha}</td><td>${s.mes?s.mes[0].toUpperCase()+s.mes.slice(1):'—'}</td><td>${s.prevision||'—'}</td><td style="text-align:right">$${fmt(s.monto)}</td><td style="text-align:center">${s.estado||'Sin estado'}</td><td style="color:#666;font-size:11px">${s.observaciones||'—'}</td></tr>`).join('');
    return`<div style="page-break-before:always;padding:32px 40px;font-family:Arial,sans-serif">
      <div style="border-bottom:2px solid #1b3f6e;padding-bottom:12px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end">
        <div><div style="font-size:10px;color:#8c96b0;text-transform:uppercase;margin-bottom:4px">Paciente</div>
          <div style="font-size:20px;font-weight:700;color:#1a2035">${p.nombre}${p.alta?'<span style="font-size:12px;color:#b86000;margin-left:8px">(Alta)</span>':''}</div>
          <div style="font-size:12px;color:#4a5578;margin-top:4px">${p.prevision||'—'} · ${p.modalidad||'Presencial'} · Año ${year}</div>
        </div>

        <div style="background:#fdeaea;border-radius:8px;padding:12px;text-align:center"><div style="font-size:10px;color:#b83232;text-transform:uppercase;margin-bottom:4px">Pendiente</div><div style="font-size:16px;font-weight:700;color:#b83232">$${fmt(pPen)}</div></div>

        <thead><tr style="background:#1b3f6e;color:#fff"><th style="padding:8px;text-align:center">#</th><th style="padding:8px;text-align:left">Fecha</th><th style="padding:8px">Mes</th><th style="padding:8px">Previsión</th><th style="padding:8px;text-align:right">Monto</th><th style="padding:8px;text-align:center">Estado</th><th style="padding:8px">Observaciones</th></tr></thead>
        <tbody>${sesRows}</tbody>
        <tfoot><tr style="background:#f0f3f8;font-weight:700;border-top:2px solid #1b3f6e"><td colspan="4" style="padding:8px">Total ${year}</td><td style="padding:8px;text-align:right">$${fmt(pTotal)}</td><td colspan="2"></td></tr></tfoot>
      </table>
    </div>`;
  }).join('');
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Consulta Privada ${year}</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;color:#1a2035;font-size:13px;-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{margin:0;size:A4}table{border-collapse:collapse;width:100%}th,td{padding:7px 10px;border-bottom:1px solid #e0e6ef}thead tr th{background:#1b3f6e;color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:0.05em}</style></head><body>
  <div style="padding:40px;font-family:Arial,sans-serif">

      <div><div style="font-size:24px;font-weight:700;color:#1b3f6e">Consulta Privada — ${year}</div><div style="font-size:13px;color:#8c96b0;margin-top:2px">Generado el ${new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})}</div></div>

      <div style="background:#e6f5ef;border-radius:10px;padding:16px"><div style="font-size:10px;color:#1a7a5a;text-transform:uppercase;margin-bottom:6px">Cobrado</div><div style="font-size:22px;font-weight:700;color:#1a7a5a">$${fmt(cobrado)}</div></div>
      <div style="background:#e8f0fb;border-radius:10px;padding:16px"><div style="font-size:10px;color:#1a5fa8;text-transform:uppercase;margin-bottom:6px">Pagado</div><div style="font-size:22px;font-weight:700;color:#1a5fa8">$${fmt(pagado)}</div></div>

    </div>
    <div style="margin-bottom:28px"><div style="font-size:11px;font-weight:600;color:#8c96b0;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Ingresos por mes</div><svg width="480" height="115" xmlns="http://www.w3.org/2000/svg">${bars}</svg></div>
    <div style="margin-bottom:28px"><div style="font-size:11px;font-weight:600;color:#8c96b0;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Por mes</div>
      <table><thead><tr><th>Mes</th><th style="text-align:center">Ses.</th><th style="text-align:right">Total</th><th style="text-align:right">Cobrado</th><th style="text-align:right">Pagado</th><th style="text-align:right">Pendiente</th></tr></thead>
      <tbody>${mesRows}<tr style="background:#f0f3f8;font-weight:700;border-top:2px solid #1b3f6e"><td>Total ${year}</td><td style="text-align:center">${yearSessions.length}</td><td style="text-align:right">$${fmt(total)}</td><td style="text-align:right;color:#1a7a5a">$${fmt(cobrado)}</td><td style="text-align:right;color:#1a5fa8">$${fmt(pagado)}</td><td style="text-align:right;color:#b83232">$${fmt(pendiente)}</td></tr></tbody></table>
    </div>
    <div><div style="font-size:11px;font-weight:600;color:#8c96b0;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Por previsión</div>
      <table><thead><tr><th>Previsión</th><th style="text-align:center">Sesiones</th><th style="text-align:right">Total</th></tr></thead><tbody>${prevRows}</tbody></table>
    </div>
  </div>
  ${patientPages}
  </body></html>`;
  const win=window.open('','_blank');
  win.document.write(html);win.document.close();
  win.onload=()=>setTimeout(()=>win.print(),500);
  sync('ok');
}

// ── BACKUP ────────────────────────────────────────────
async function downloadBackup(){
  sync('saving','Exportando…');
  try{
    const{data:pats}=await sb.from('pacientes').select('*').order('nombre');
    const{data:sess}=await sb.from('sesiones').select('*').order('created_at');
    const blob=new Blob([JSON.stringify({fecha:new Date().toISOString(),pacientes:pats,sesiones:sess},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=`consulta_respaldo_${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);sync('ok');
  }catch(e){sync('error');}
}

checkSession();
